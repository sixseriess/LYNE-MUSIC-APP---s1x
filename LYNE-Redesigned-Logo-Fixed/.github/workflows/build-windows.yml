name: Build LYNE for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Locate LYNE app folder
        id: locate
        shell: pwsh
        run: |
          $manifest = Get-ChildItem -Path . -Filter package.json -Recurse -File | Where-Object { $_.FullName -notmatch '\\(node_modules|\.git)\\' } | Where-Object {
            try { $p = Get-Content $_.FullName -Raw | ConvertFrom-Json; $p.scripts.'electron:build:win' } catch { $false }
          } | Select-Object -First 1
          if (-not $manifest) { throw 'Could not find the LYNE package.json. Upload the contents of the LYNE project ZIP, not an extra parent folder.' }
          $dir = Split-Path $manifest.FullName -Parent
          $relative = Resolve-Path $dir -Relative
          if ($relative -eq '.') { $relative = '.' }
          "dir=$relative" >> $env:GITHUB_OUTPUT
          Write-Host "Found LYNE app in: $relative"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.dir }}
        run: pnpm install --no-frozen-lockfile

      - name: Build LYNE installer
        working-directory: ${{ steps.locate.outputs.dir }}
        run: pnpm electron:build:win
        env:
          CI: "true"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: LYNE-Windows-Installer
          path: |
            ${{ steps.locate.outputs.dir }}/release/*.exe
            ${{ steps.locate.outputs.dir }}/release/*.blockmap
            ${{ steps.locate.outputs.dir }}/release/latest.yml
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.locate.outputs.dir }}/release/*.exe
            ${{ steps.locate.outputs.dir }}/release/*.blockmap
            ${{ steps.locate.outputs.dir }}/release/latest.yml
