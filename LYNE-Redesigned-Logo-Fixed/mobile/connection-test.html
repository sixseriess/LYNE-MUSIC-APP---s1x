<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LYNE Connection Test</title>
<style>
:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;background:#090a09;color:#f4f4f0}
body{margin:0;padding:28px 20px;max-width:640px}
h1{font-size:25px;margin:0 0 8px}p{color:#a6a99f;line-height:1.5}
.card{background:#151714;border:1px solid #2b3028;border-radius:14px;padding:16px;margin:14px 0}
.status{font-weight:650;margin-bottom:7px}.detail{font:13px/1.5 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:#b7c5a5}
button{background:#c8f56a;color:#111;border:0;border-radius:10px;padding:13px 18px;font-weight:700;font-size:15px}
</style>
</head>
<body>
<h1>LYNE connection test</h1>
<p>This checks the same browser-to-API connection used by mobile sign-in. It does not log you in or collect account details.</p>
<button id="run">Run test again</button>
<div id="results"></div>
<script>
const base="https://api.tryliner.fun";
const out=document.getElementById("results");
function add(title,status,detail){
 const card=document.createElement("section");card.className="card";
 const h=document.createElement("div");h.className="status";h.textContent=title+" — "+status;
 const d=document.createElement("div");d.className="detail";d.textContent=detail;
 card.append(h,d);out.append(card);
}
async function check(title,url,init){
 const start=performance.now();
 try{
  const r=await fetch(url,{...init,cache:"no-store"});
  const text=await r.text();
  add(title,"HTTP "+r.status,Math.round(performance.now()-start)+" ms\n"+text.slice(0,700));
 }catch(e){add(title,"FAILED",String(e)+"\n"+(e&&e.message?e.message:""))}
}
async function run(){
 out.replaceChildren();
 await check("API health fetch",base+"/health");
 await check("Login challenge fetch",base+"/v1/auth/challenge",{
  method:"POST",headers:{"Content-Type":"application/json","x-client-version":"1.0.4-mobile","x-platform":"ios","x-request-id":"lyne-mobile-diagnostic"},
  body:JSON.stringify({purpose:"login",email:""})
 });
}
document.getElementById("run").addEventListener("click",run);
run();
</script>
</body>
</html>
