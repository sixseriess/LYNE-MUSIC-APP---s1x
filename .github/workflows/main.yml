
name: Build LYNE for Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project folder
        id: project
        shell: pwsh
        run: |
          $manifest = Get-ChildItem -Path . -Filter package.json -Recurse -File |
            Where-Object { $_.FullName -notmatch '\\node_modules\\' } |
            Select-Object -First 1

          if (-not $manifest) {
            Write-Error "No package.json found in repository."
            exit 1
          }

          $folder = $manifest.Directory.FullName
          "working-directory=$folder" >> $env:GITHUB_OUTPUT
          Write-Host "Found LYNE project at $folder"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.working-directory }}
        run: pnpm install

      - name: Build LYNE
        working-directory: ${{ steps.project.outputs.working-directory }}
        run: pnpm run electron:build:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LYNE-Windows-Installer
          path: |
            **/release/**/*.exe
            **/dist/**/*.exe
            **/out/**/*.exe
          if-no-files-found: warn
          retention-days: 14
