
name: Build LYNE for Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project folder
        id: project
        shell: pwsh
        run: |
          $manifest = Get-ChildItem -Path . -Filter package.json -Recurse -File |
            Where-Object { $_.FullName -notmatch '\\node_modules\\' } |
            Select-Object -First 1

          if (-not $manifest) {
            Write-Error "No package.json found in repository."
            exit 1
          }

          $folder = $manifest.Directory.FullName
          "working-directory=$folder" >> $env:GITHUB_OUTPUT
          Write-Host "Found LYNE project at $folder"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.working-directory }}
        run: pnpm install --no-frozen-lockfile

      - name: Build LYNE
        working-directory: ${{ steps.project.outputs.working-directory }}
        run: pnpm run electron:build:win

      - name: Verify stream-quality and LYNE deeplink tests
        working-directory: ${{ steps.project.outputs.working-directory }}
        run: pnpm exec vitest run src/shared/youtube/innertube/innertubeAudioFormats.test.ts electron/deeplink.test.ts

      - name: Read LYNE version
        id: app-version
        shell: pwsh
        working-directory: ${{ steps.project.outputs.working-directory }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          "version=$($package.version)" >> $env:GITHUB_OUTPUT

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LYNE-Windows-Installer
          path: |
            **/release/**/*.exe
            **/release/**/*.blockmap
            **/release/latest.yml
          if-no-files-found: error
          retention-days: 14

      - name: Publish LYNE GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app-version.outputs.version }}
          name: LYNE v${{ steps.app-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            ${{ steps.project.outputs.working-directory }}/release/*.exe
            ${{ steps.project.outputs.working-directory }}/release/*.blockmap
            ${{ steps.project.outputs.working-directory }}/release/latest.yml
          fail_on_unmatched_files: true
