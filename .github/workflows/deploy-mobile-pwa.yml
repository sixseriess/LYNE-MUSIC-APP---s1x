name: Build and deploy LYNE Mobile

on:
  push:
    branches: [mobile-pwa]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out mobile branch
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: LYNE-Redesigned-Logo-Fixed/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: LYNE-Redesigned-Logo-Fixed
        run: pnpm install --no-frozen-lockfile

      - name: Build installable PWA
        working-directory: LYNE-Redesigned-Logo-Fixed
        run: pnpm build:pwa

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: LYNE-Redesigned-Logo-Fixed/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy mobile PWA
        id: deployment
        uses: actions/deploy-pages@v4
