# Re-trigger Pages deployment after enabling GitHub Pages in repository settings.
name: Deploy LYNE Mobile PWA

on:
  push:
    branches: [mobile-pwa]
    paths:
      - "LYNE-Redesigned-Logo-Fixed/**"
      - ".github/workflows/mobile-pwa-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lyne-mobile-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LYNE-Redesigned-Logo-Fixed
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: LYNE-Redesigned-Logo-Fixed/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build mobile PWA for GitHub Pages
        run: pnpm mobile:build
        env:
          VITE_MOBILE_BASE: /LYNE-MUSIC-APP---s1x/mobile/
          VITE_API_URL: https://lyne-mobile-api.nealeadam10.workers.dev
          VITE_MOBILE_SUPABASE_URL: https://gvvlajfslvjlyctzjuol.supabase.co
          VITE_MOBILE_SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd2dmxhamZzbHZqbHljdHpqdW9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0NTA2NjEsImV4cCI6MjEwOTAyNjY2Nn0.C18CXbPolq9U0BG823NFdd9Rtjb7J98dprrv2skhaS4
      - name: Stage site under /mobile/
        run: |
          mkdir -p dist-pages/mobile
          cp -a dist-mobile/. dist-pages/mobile/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: LYNE-Redesigned-Logo-Fixed/dist-pages

  deploy:
    environment:
      name: lyne-mobile-pwa
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
