name: Diagnose LYNE Mobile API Access

on:
  push:
    branches: [mobile-pwa]
    paths:
      - ".github/workflows/mobile-api-cors-check.yml"

permissions:
  contents: read

jobs:
  check-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check browser preflight for GitHub Pages origin
        shell: bash
        run: |
          set +e
          curl --silent --show-error --max-time 20 \
            --request OPTIONS \
            --dump-header /tmp/headers.txt \
            --output /tmp/body.txt \
            --write-out "HTTP_STATUS=%{http_code}\n" \
            "https://api.tryliner.fun/v1/auth/challenge" \
            --header "Origin: https://sixseriess.github.io" \
            --header "Access-Control-Request-Method: POST" \
            --header "Access-Control-Request-Headers: content-type,x-client-version,x-platform,x-request-id"
          result=$?
          echo "CURL_EXIT=$result"
          echo "--- API PREFLIGHT RESPONSE HEADERS ---"
          cat /tmp/headers.txt 2>/dev/null || true
          echo "--- API PREFLIGHT RESPONSE BODY ---"
          cat /tmp/body.txt 2>/dev/null || true
